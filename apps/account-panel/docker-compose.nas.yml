# account-panel NAS 部署 compose。复制到 NAS 后作为 /volume1/docker/account-panel/docker-compose.yaml 使用。
# 约定（参考 NAS-PROJECTS/docs/nas-project-template/）：
#   - 部署目录 /volume1/docker/account-panel/（root:root、权限 700，SSH 手动建要 chown/chmod）
#   - 真实密钥放同目录 .env（chmod 600），本文件用 ${VAR} 引用，不入库
#   - 数据 bind mount 到 ./data，可见、可备份
# 自动更新：镜像推 ghcr 后，NAS 上全局 watchtower 发现 latest 变化会自动 pull + 重建
#   （本容器需带下面 watchtower label；watchtower 若还没部署，见 nas-hello/watchtower.compose.yml，
#     关键坑：必须覆盖 DOCKER_API_VERSION=1.43，否则 UGOS 上起不来）。
services:
  account-panel:
    image: ghcr.io/sakurachiyo0v0/account-panel:latest
    container_name: account-panel
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - TZ=Asia/Hong_Kong
      - NODE_ENV=production
      - PORT=8787
      - DOWNLOAD_DIR=/downloads
      # 生产容器用系统 chromium（Dockerfile 已装），番剧加密源浏览器取流兜底需要
      - USE_SYSTEM_CHROMIUM=1
      # 配置中心：PG 连接串 + 加密密钥（密钥丢失将无法解密已保存的平台登录态）
      - PG_URL=${PG_URL:?请在 .env 提供 PG_URL}
      - CONFIG_KEY=${CONFIG_KEY:?请在 .env 提供 CONFIG_KEY}
    volumes:
      - ./data:/downloads    # 下载文件 + 日志 + kazumi 规则 持久化
    labels:
      - com.centurylinklabs.watchtower.enable=true
