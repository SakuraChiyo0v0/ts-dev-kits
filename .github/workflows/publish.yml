name: publish

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "!packages/*/README.md"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "scripts/publish-packages.mjs"
      - "scripts/check-package-bumps.mjs"
      - "scripts/check-dependency-chain.mjs"
      - "scripts/packages-list.mjs"
      - ".github/workflows/publish.yml"
  pull_request:
    paths:
      - "packages/**"
      - "!packages/*/README.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  # 版本守卫:改了包内容但没 bump 版本号 -> 失败,publish 不会执行
  check-versions:
    name: 校验版本 bump
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check version bumps
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="origin/main"
          fi
          echo "comparing against: ${BASE}"
          node scripts/check-package-bumps.mjs "${BASE}"

      # 依赖链守卫:workspace:* 发布后会替换成本地版本,若依赖的版本不存在
      # (未发布/发布顺序错误)则消费者安装断链。CI 必须带 token 验证 registry。
      - name: Check dependency chain
        run: node scripts/check-dependency-chain.mjs
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  publish:
    needs: check-versions
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://npm.pkg.github.com"
          scope: "@sakurachiyo0v0"
          token: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish changed packages
        run: node scripts/publish-packages.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
